<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="阅读器">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<title>阅读器</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#1d1c1a; --muted:#6f6a62; --line:#e6e0d6;
  --accent:#c2502d; --accent-soft:#f6e3db; --blue:#2f5d8a; --blue-soft:#e2ecf5;
  --green:#3d7a4a; --green-soft:#e1efe3; --chip:#efe9e0; --mark:#f7dd8a; --fs:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){
  --bg:#141413; --card:#1f1e1c; --ink:#ece8e1; --muted:#9a948a; --line:#2e2c29;
  --accent:#e57a55; --accent-soft:#3a2720; --blue:#7fb0de; --blue-soft:#1d2a37;
  --green:#7cc28a; --green-soft:#1e2e22; --chip:#2a2825; --mark:#6b5a1f;
}}
:root[data-theme=dark]{
  --bg:#141413; --card:#1f1e1c; --ink:#ece8e1; --muted:#9a948a; --line:#2e2c29;
  --accent:#e57a55; --accent-soft:#3a2720; --blue:#7fb0de; --blue-soft:#1d2a37;
  --green:#7cc28a; --green-soft:#1e2e22; --chip:#2a2825; --mark:#6b5a1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--chip);font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}
.hide{display:none!important}

/* 书库 */
#lib{max-width:680px;margin:0 auto;padding:20px 16px 60px}
#lib header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
#lib h1{font-size:22px;flex:1}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.doc .main{flex:1;min-width:0}
.doc h2{font-size:16.5px;line-height:1.45;word-break:break-all}
.doc .meta{font-size:13px;color:var(--muted);margin-top:2px}
.doc .q{font-size:14px;margin-top:6px;padding:6px 10px;border-left:3px solid var(--blue);background:var(--blue-soft);border-radius:0 8px 8px 0}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.drop{display:block;cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);margin-bottom:14px}

/* 阅读 */
#rd{min-height:100vh}
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:6px 6px;padding-top:max(6px,env(safe-area-inset-top));transition:transform .2s}
.top .title{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{min-width:40px;height:38px;border-radius:10px;font-size:15px;padding:0 8px}
.ib:active{background:var(--chip)}
.bot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 10px;padding-bottom:max(6px,env(safe-area-inset-bottom));transition:transform .2s}
.hidebars .top{transform:translateY(-110%)}.hidebars .bot{transform:translateY(110%)}
.pg{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.pg input{width:58px;padding:4px 6px;text-align:center;border-radius:8px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
#view{padding:56px 0 64px}
.sec{position:relative;overflow-anchor:auto}
.sec .ph{display:flex;justify-content:space-between;align-items:center;font:12px sans-serif;color:var(--muted);border-top:1px dashed var(--line);padding:4px 16px;max-width:720px;margin:0 auto;opacity:.75}
.sec .ph button{font-size:12px;color:var(--muted);padding:2px 6px}
.rf{max-width:720px;margin:0 auto;padding:4px 18px 12px;font:var(--fs)/1.85 "Noto Serif SC","Songti SC","Source Han Serif SC",Georgia,serif}
.rf p{margin:.55em 0;text-indent:2em;text-align:justify;word-break:break-word;overflow-wrap:anywhere}
.rf p.h{text-indent:0;font-weight:700;font-size:1.12em;margin:1.2em 0 .5em;text-align:left}
.rf p.c{text-indent:0;text-align:center;color:var(--muted);font-size:.8em}
.rf mark{background:var(--mark);color:inherit;border-radius:2px;cursor:pointer}
.rf mark.n{border-bottom:2px solid var(--accent)}
.rf mark.f-th{background:rgba(229,83,61,.30)}.rf mark.f-ev{background:rgba(61,160,90,.30)}.rf mark.f-ex{background:rgba(32,170,180,.28)}
.rf mark.f-qu{background:rgba(150,95,210,.28)}.rf mark.f-op{background:rgba(60,120,220,.28)}.rf mark.f-df{background:rgba(240,170,40,.38)}
.fd{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:4px;background:var(--mark)}
.fd.f-th{background:rgb(229,83,61)}.fd.f-ev{background:rgb(61,160,90)}.fd.f-ex{background:rgb(32,170,180)}.fd.f-qu{background:rgb(150,95,210)}.fd.f-op{background:rgb(60,120,220)}.fd.f-df{background:rgb(240,170,40)}
#selbar .fnrow{display:none;width:100%;justify-content:space-around}
#selbar.pick .mainrow{display:none}#selbar.pick .fnrow{display:flex}
#selbar .mainrow{display:flex;width:100%}
#selbar .fnrow button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 1px}
#selbar .fnrow .fd{width:16px;height:16px;margin:0}
.rf .none{text-indent:0;color:var(--muted);font-size:15px;font-family:sans-serif}
.loading{color:var(--muted);font-size:14px;padding:30px 18px;text-align:center}
.og{overflow-x:auto;padding:4px 0}
.cv{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cv canvas{display:block;width:100%;height:100%}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(194,80,45,.3)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.zoom{display:flex;gap:2px}

/* 选中工具条 */
#selbar{position:fixed;left:8px;right:8px;bottom:max(10px,env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;display:flex;justify-content:space-around;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#selbar button{color:var(--bg);padding:10px 1px;font-size:13.5px;font-weight:600;flex:1}

/* 底部面板 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,.2);max-width:720px;margin:0 auto}
#sheet .sh{display:flex;align-items:center;padding:12px 16px 8px;gap:8px;border-bottom:1px solid var(--line)}
#sheet .sh h3{flex:1;font-size:17px}
#sheet .sb{overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.quote{font:15.5px/1.7 "Noto Serif SC","Songti SC",serif;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin-bottom:10px;max-height:9.5em;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:5px 11px;border-radius:999px;background:var(--chip);font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff}
.chip.t1.on{background:var(--green)}.chip.t2.on{background:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.lbl{font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.note .nq{font:14.5px/1.65 "Noto Serif SC","Songti SC",serif;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.note .nt{font-size:14.5px;margin-top:6px;white-space:pre-wrap}
.note .nm{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--chip)}
.tag.t1{background:var(--green-soft);color:var(--green)}.tag.t2{background:var(--accent-soft);color:var(--accent)}.tag.t3{background:var(--blue-soft);color:var(--blue)}
.msg{margin:10px 0;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--blue-soft);padding:8px 12px;border-radius:12px 12px 2px 12px;margin-left:12%}
.msg.a{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:12px 12px 12px 2px;margin-right:4%}
.msg.e{color:var(--accent);font-size:14px}
.toc a{display:block;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;color:inherit;text-decoration:none}
.toc a small{color:var(--muted);float:right}
.guide{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;white-space:pre-wrap}
.arc h4{font-size:16px;margin:18px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.arc h4:first-child{border-top:0;margin-top:0;padding-top:0}
.arc h5{font-size:14.5px;margin:12px 0 4px;color:var(--muted)}
.arc p{font-size:15px;line-height:1.75;margin:6px 0;white-space:pre-wrap}
.arc ul,.arc ol{padding-left:1.3em;font-size:15px;line-height:1.7;margin:4px 0}
.arc blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted);margin:6px 0;font-size:14.5px}
.arc .who{font-weight:700;font-size:13px;margin-top:10px}
.arc .who.t{color:var(--accent)}.arc .who.m{color:var(--blue)}
.arc .tbox{background:var(--accent-soft);border-radius:10px;padding:2px 12px;margin:4px 0}
.arc .mbox{background:var(--blue-soft);border-radius:10px;padding:2px 12px;margin:4px 0}
.arc .toc2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
a.pl{color:var(--blue);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--blue);padding:0 1px}
a.pl.flash{background:var(--mark);border-radius:3px}
.ph .arcb{margin-left:8px;color:var(--accent);font-weight:600}
#arcBack{position:fixed;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;background:var(--accent);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
#arcBack button{color:#fff;font-size:14px}
.rf.ep p{text-indent:0;margin:.7em 0;text-align:left;hyphens:auto;-webkit-hyphens:auto}
.rf.ep p.h{font-size:1.1em;margin:1.3em 0 .4em}
.rf.ep h1,.rf.ep h2,.rf.ep h3,.rf.ep h4{font-size:1.12em;line-height:1.5;margin:1.2em 0 .5em}
.rf.ep blockquote{margin:.6em 0 .6em .6em;padding-left:.8em;border-left:3px solid var(--line);color:var(--muted)}
.rf.ep ul,.rf.ep ol{padding-left:1.4em}
.rf.ep table{font-size:.82em;border-collapse:collapse;display:block;overflow-x:auto;margin:.8em 0}
.rf.ep td,.rf.ep th{border:1px solid var(--line);padding:3px 6px}
.rf img{max-width:100%;height:auto;display:block;margin:12px auto}
.pbm{display:inline-block;font:11px/1.5 sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:0 4px;vertical-align:middle;text-indent:0;user-select:none;-webkit-user-select:none}
.pbm.ar{color:var(--accent);border-color:var(--accent);cursor:pointer}
.rf a.xl{color:var(--blue);text-decoration:none;border-bottom:1px dotted var(--blue)}
.rf a.fn{color:var(--blue);text-decoration:none;font:600 .7em sans-serif;vertical-align:super;padding:0 2px}
abbr.gl{text-decoration:underline dotted var(--blue);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
.tabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.qhead{background:var(--blue-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.6}
.qhead b{color:var(--blue)}
.qg{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 4px}
.qi{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:15px;line-height:1.6}
.qi .qt{flex:1;white-space:pre-wrap}
.qi.done .qt{opacity:.5;text-decoration:line-through}
.qi button{font-size:16px;padding:0 2px;color:var(--muted)}
.qi .kind{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--muted);white-space:nowrap}
.cref{font-size:13px;color:var(--muted);margin-top:4px}
.zh{font-size:14.5px;margin-top:6px;padding:6px 10px;background:var(--blue-soft);border-radius:8px;white-space:pre-wrap}
details.ai{margin-top:12px}details.ai summary{font-size:13px;color:var(--muted);font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}
</style>
</head>
<body>

<div id="lib">
  <header>
    <h1>阅读器</h1>
    <a class="btn sm" href="../">← 信息台</a>
    <button class="ib" id="bSet" title="设置">⚙︎</button>
  </header>
  <label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf,application/epub+zip,.epub" multiple hidden>＋ 添加 PDF 或 EPUB<br><small>文件只存在这台设备上</small></label>
  <div id="docs"></div>
  <div class="row" style="justify-content:center;margin-top:24px;flex-wrap:wrap">
    <button class="btn sm" id="bBackup">备份笔记</button>
    <label class="btn sm">恢复备份<input type="file" id="restore" accept=".json,application/json" hidden></label>
  </div>
</div>

<div id="rd" class="hide">
  <div class="top">
    <button class="ib" id="bBack">‹</button>
    <div class="title" id="title"></div>
    <button class="ib" id="bToc">目录</button>
    <button class="ib" id="bStudy">研究</button>
    <button class="ib" id="bNotes">笔记</button>
    <button class="ib" id="bFont">Aa</button>
  </div>
  <div id="view"></div>
  <div class="bot">
    <div class="pg">p.<input id="pgIn" inputmode="numeric"> / <span id="pgN"></span></div>
    <div style="flex:1"></div>
    <button class="btn sm" id="bQ">导读</button>
    <div class="zoom hide" id="zoom"><button class="ib" id="zOut">－</button><button class="ib" id="zIn">＋</button></div>
    <div class="seg"><button data-m="og">原版</button><button data-m="rf">重排</button></div>
  </div>
</div>

<div id="selbar" class="hide"><div class="mainrow">
  <button id="sMark">划线</button>
  <button id="sNote">笔记</button>
  <button id="sAsk">问AI</button>
  <button id="sTerm">术语</button>
  <button id="sPhr">表达</button>
  <button id="sCite">引用</button>
  <button id="sCopy">复制</button></div>
  <div class="fnrow" id="fnRow"></div>
</div>

<div id="arcBack" class="hide"><button id="abGo">← 返回</button><button id="abX">✕</button></div>
<div id="mask" class="hide"></div>
<div id="sheet" class="hide"><div class="sh"><h3 id="shT"></h3><button class="ib" id="shX">✕</button></div><div class="sb" id="shB"></div></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
const PDFOPT={cMapUrl:'lib/cmaps/',cMapPacked:true,standardFontDataUrl:'lib/standard_fonts/'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(t,ms=2200){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),ms)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TAGS=[['t1','支持我'],['t2','反对我'],['t3','背景'],['t4','疑问']];
const tagName=t=>(TAGS.find(x=>x[0]===t)||[])[1]||'';
const FNS=[['th','论点'],['ev','论据'],['ex','例证'],['qu','让步/限定'],['op','反方观点'],['df','概念'],['','普通']];
const fnName=f=>(FNS.find(x=>x[0]===f)||[])[1]||'';
const PFNS=['立论','举证','让步','反驳','回应','限定','过渡','总结','追问','其他'];

/* ---------- 存储 ---------- */
let db;
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('reader',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'id'});d.createObjectStore('files');
    const n=d.createObjectStore('notes',{keyPath:'id'});n.createIndex('doc','docId');d.createObjectStore('ocr');d.createObjectStore('chats');d.createObjectStore('meta')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const dget=(s,k)=>P(st(s).get(k));
const dput=(s,v,k)=>P(k===undefined?st(s,'readwrite').put(v):st(s,'readwrite').put(v,k));
const ddel=(s,k)=>P(st(s,'readwrite').delete(k));
const dall=s=>P(st(s).getAll());
const notesOf=id=>P(st('notes').index('doc').getAll(id));
async function getLines(){return (await dget('meta','lines'))||['YouTube频道','更舵','Ausbildung学习']}

/* ---------- Claude ---------- */
const MODELS=[['claude-sonnet-5-5','Sonnet 5.5（推荐）'],['claude-opus-5-5','Opus 5.5（更强，更贵）'],['claude-haiku-5-5','Haiku 5.5（快，便宜）']];
async function claude({system,messages,max=1600,onText}){
  const key=ls.get('key','');if(!key)throw new Error('还没有填 Claude API 密钥：回到书库点右上角 ⚙︎ 设置');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:ls.get('model',MODELS[0][0]),max_tokens:max,system,messages,stream:true})});
  if(!r.ok){let t=await r.text();try{t=JSON.parse(t).error.message}catch(e){}throw new Error('接口返回 '+r.status+'：'+t.slice(0,300))}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);const ln=ev.split('\n').find(l=>l.startsWith('data:'));if(!ln)continue;
      let d;try{d=JSON.parse(ln.slice(5))}catch(e){continue}
      if(d.type==='content_block_delta'&&d.delta&&d.delta.type==='text_delta'){out+=d.delta.text;onText&&onText(out)}

const isCJK=c=>/[⺀-鿿豈-﫿＀-￯　-〿]/.test(c||'');
async function rawLines(n){
  const page=await S.pdf.getPage(n);const tc=await page.getTextContent();const vp=page.getViewport({scale:1});
  const lines=[];let L=null;
  for(const it of tc.items){
    if(!('str' in it))continue;
    const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||Math.hypot(it.transform[2],it.transform[3])||it.height||10;
    if(!it.str.trim()){if(L&&it.str)L.t+=' ';if(it.hasEOL)L=null;continue}
    if(L&&Math.abs(L.y-y)<=h*.6&&x>=L.x0-2){
      const gap=x-L.xe;if(gap>h*.25&&!L.t.endsWith(' ')&&!(isCJK(L.t.slice(-1))&&isCJK(it.str[0])))L.t+=' ';
      L.t+=it.str;L.xe=Math.max(L.xe,x+it.width);L.h=Math.max(L.h,h)}
    else{L={x,x0:x,y,h,t:it.str,xe:x+it.width};lines.push(L)}
    if(it.hasEOL)L=null}
  return {lines:lines.map(l=>({x:l.x,y:l.y,h:l.h,xe:l.xe,t:l.t.replace(/\s+/g,' ').trim()})).filter(l=>l.t),W:vp.width,H:vp.height}}
const norm=t=>t.replace(/\d+/g,'#').replace(/\s/g,'');
async function learnBoiler(){
  const n=Math.min(S.pdf.numPages,14),cnt=new Map();
  for(let i=1;i<=n;i++){try{const {lines}=await rawLines(i);const seen=new Set();
    for(const l of [...lines.slice(0,3),...lines.slice(-3)]){const k=norm(l.t);if(k&&!seen.has(k)){seen.add(k);cnt.set(k,(cnt.get(k)||0)+1)}}}catch(e){}}
  S.boiler=new Set([...cnt].filter(([k,c])=>c>=Math.max(3,n*.4)).map(([k])=>k))}
function median(a){if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y);return b[b.length>>1]}
function joinLine(a,b){
  if(/[A-Za-zÄÖÜäöüß]-$/.test(a)&&/^[a-zäöüß]/.test(b))return a.slice(0,-1)+b;
  if(isCJK(a.slice(-1))||isCJK(b[0]))return a+b;
  return a+' '+b}
async function pageParas(n){
  if(S.paras.has(n))return S.paras.get(n);
  const ocr=await dget('ocr',S.doc.id+':'+n);
  if(ocr){const r=ocr.split(/\n\s*\n/).map(t=>t.trim()).filter(Boolean).map(t=>t.startsWith('#')?{h:1,t:t.replace(/^#+\s*/,'')}:{t:t.replace(/\n/g,'')});S.paras.set(n,r);return r}
  let {lines}=await rawLines(n);
  lines=lines.filter(l=>!/^[-–—\s]*\d{1,4}[-–—\s]*$/.test(l.t)&&!S.boiler.has(norm(l.t)));
  if(!lines.length){S.paras.set(n,[]);return []}
  const mh=median(lines.map(l=>l.h)),left=median(lines.map(l=>l.x)),right=Math.max(...lines.map(l=>l.xe));
  const gaps=[];for(let i=1;i<lines.length;i++){const g=lines[i-1].y-lines[i].y;if(g>0)gaps.push(g)}
  const mg=median(gaps)||mh*1.5;
  const out=[];let cur=null,prev=null;
  for(const l of lines){
    const big=l.h>mh*1.18&&l.t.length<60;
    const cap=/^(图|表|Abb\.|Tab\.|Figure|Table)\s*\d/.test(l.t)&&l.t.length<80;
    if(big&&cur&&cur.h&&prev&&prev.y-l.y<mg*1.8){cur.t=joinLine(cur.t,l.t);prev=l;continue}
    let brk=!cur||big||cap||(cur&&(cur.h||cur.c));
    if(!brk&&prev){
      const g=prev.y-l.y;
      if(g>mg*1.45||g<-mh)brk=true;
      else if(l.x>left+mh*1.3&&l.x>prev.x+mh*.8)brk=true;
      else if(prev.xe<right-mh*2.2&&/[。！？”」』.!?:：…]$/.test(prev.t))brk=true}
    if(brk){cur={t:l.t};if(big)cur.h=1;if(cap)cur.c=1;out.push(cur)}
    else cur.t=joinLine(cur.t,l.t);
    prev=l}
  S.paras.set(n,out);return out}
async function pageText(n){if(isEp())return epPageText(n);const p=await pageParas(n);return p.map(x=>x.t).join('\n')}

async function addFiles(files){

async function newNote(text,tag,fn){const sel=S.sel;const n={...selNote(sel),id:uid(),text:text||'',tag:tag||'',fn:fn||'',at:Date.now()};
  await saveNote(n);return n}
async function saveNote(n){if(!n.id)n.id=uid();if(!n.at)n.at=Date.now();await dput('notes',n);
  const i=S.notes.findIndex(x=>x.id===n.id);if(i>=0)S.notes[i]=n;else S.notes.push(n);refreshFor(n)}
async function removeNote(n){await ddel('notes',n.id);S.notes=S.notes.filter(x=>x.id!==n.id);refreshFor(n)}
function refreshFor(n){if(isEp()){const s=S.secs[n.sec];if(!s)return;const b=s.querySelector('.body');if(!b.querySelector('.rf'))return;b.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes));b.normalize();paintMarks(b,n.sec);return}refreshPage(n.page)}
function refreshPage(p){const s=S.secs[p-1];if(!s)return;const b=s.querySelector('.body');if(b.querySelector('.rf p:not(.none)')){b.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes));b.normalize();paintMarks(b,p)}}
function paintMarks(b,p){
  const root=b.querySelector('.rf');if(!root)return;
  for(const n of S.notes.filter(x=>isEp()?x.sec===p:x.page===p)){
    const nodes=[];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let t,all='';
    while((t=w.nextNode())){nodes.push([t,all.length]);all+=t.data}
    const q=n.quote.replace(/\s+/g,' ');let i=all.indexOf(q),len=q.length;
    if(i<0){const h=q.slice(0,24);i=all.indexOf(h);len=Math.min(q.length,all.length-i)}
    if(i<0)continue;const end=i+len;
    for(const [node,off] of nodes){const a=Math.max(i,off),z=Math.min(end,off+node.data.length);if(a>=z)continue;
      const r=document.createRange();r.setStart(node,a-off);r.setEnd(node,z-off);const m=document.createElement('mark');m.dataset.id=n.id;m.className=(n.fn?'f-'+n.fn:'')+((n.text||(n.ai&&n.ai.length))?' n':'');
      try{r.surroundContents(m)}catch(e){}}}}

  const ctx=isEp()?ctxEp(n.sec,n.i):(await pageText(Math.max(1,n.page-1))).slice(-1500)+'\n'+(await pageText(n.page))+'\n'+(n.page<S.doc.pages?(await pageText(n.page+1)).slice(0,1200):'');
  const sys=`你是一位牛津式阅读导师，陪用户读《${S.doc.name}》。\n${studyBlock()}\n回答要求：用中文，具体、简洁，先直接回答；如有关联，再用一两句点出这段和研究问题的关系；引用原文时标页码 p.N；原文里没有的不要编造，不确定就说不确定。`;
  const send=async q=>{
    if(!q.trim())return;const chat=$('#chat');
    const first=!n.ai||!n.ai.length;n.ai=n.ai||[];
    const userMsg=first?`【${locLabel(n)} 附近原文】\n${ctx.slice(0,9000)}\n\n【我选中的文字（${locLabel(n)}）】\n${n.quote}\n\n【问题】${q}`:q;
    const hist=n.ai.map((m,i)=>({role:m.role,content:i===0&&m.full?m.full:m.content}));
    n.ai.push({role:'user',content:q,full:first?userMsg:undefined});
    chat.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div><div class="msg a">…</div>`);
    const out=chat.lastElementChild;out.scrollIntoView({block:'nearest'});$('#qGo').disabled=true;

function mdInline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/p\.(\d{1,4})/g,(m,n)=>+n<=S.doc.pages?`<a class="pl" href="#" data-p="${n}">p.${n}</a>`:m)}
function mdBlock(md){
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const raw of md.split('\n')){const l=raw.trimEnd();
    if(!l.trim()){close();continue}
    let m;
    if((m=l.match(/^#{1,6}\s+(.*)/))){close();out.push(`<h5>${mdInline(m[1])}</h5>`)}
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push(`<li>${mdInline(m[1])}</li>`)}
    else if((m=l.match(/^\s*\d+[.、]\s+(.*)/))){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push(`<li>${mdInline(m[1])}</li>`)}
    else if((m=l.match(/^>\s?(.*)/))){close();out.push(`<blockquote>${mdInline(m[1])}</blockquote>`)}
    else{close();out.push(`<p>${mdInline(l)}</p>`)}}
  close();return out.join('')}

    <div class="row"><button class="btn pri" id="pS">保存</button><button class="btn" id="pA">AI 解析</button><div style="flex:1"></div>${x.id?'<button class="btn" id="pX" style="color:var(--accent)">删除</button>':''}</div>`);
  let fn=x.fn;
  $('#pF').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;fn=fn===b.textContent?'':b.textContent;$('#pF').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===fn))};
  $('#pS').onclick=async()=>{const ph=$('#pP').value.trim();if(!ph){toast('先填表达');return}Object.assign(x,{phrase:ph,fn,zh:$('#pZ').value.trim(),mine:$('#pM').value.trim()});
    if(!x.id){x.id=uid();x.at=Date.now();PHR.push(x)}await savePhr();closeSheet();toast('已存入表达收集表')};
  $('#pA').onclick=async()=>{const ph=$('#pP').value.trim();if(!ph)return;const out=$('#pZ'),btn=$('#pA');btn.disabled=true;out.value='…';const st=S.doc&&S.doc.study||{};
    try{await claude({max:700,system:'你是德语学术写作和口语表达的老师。用中文讲解，例句用德语。简洁。',
      messages:[{role:'user',content:`德语表达：${ph}
原文例句：${x.ex||'（无）'}

请按这个格式回答：
模板：把它改写成可复用的句型，可替换部分用 … 表示
功能：它在论证里起什么作用（立论/举证/让步/反驳/回应/限定/过渡/总结/追问）
意思：中文意思
语法：语序、配合的连词或固定搭配等要点
例句：围绕这个问题用它造一个德语句子，附中文：${st.q||st.big||'工业转型中的社会计划'}`}],onText:t=>{out.value=t}});
      const m=out.value.match(/功能[:：]\s*(立论|举证|让步|反驳|回应|限定|过渡|总结|追问)/);if(m&&!fn){fn=m[1];$('#pF').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.textContent===fn))}}
    catch(e){out.value='';toast(e.message,4000)}btn.disabled=false};
  if($('#pX')){let armed=false;$('#pX').onclick=async e=>{if(!armed){armed=true;e.target.textContent='确认删除';return}PHR=PHR.filter(y=>y.id!==x.id);await savePhr();closeSheet();toast('已删除')}}}

/* ---------- 引用库 ---------- */
function surname(a){a=(a||'').trim();if(!a)return '';if(a.includes(','))return a.split(',')[0].trim();const p=a.split(/\s+/);return p[p.length-1]}
function bibLine(){const b=S.doc.biblio||{};if(!b.author&&!b.title)return '未填写';return `${b.author||''}${b.year?` (${b.year})`:''}: ${b.title||''}.${b.place||b.publisher?' '+[b.place,b.publisher].filter(Boolean).join(': ')+'.':''}`}
function citeRef(c){const b=S.doc.biblio||{};const who=surname(b.author)||'作者';return `${who} ${b.year||'o. J.'}, ${c.page?'S. '+c.page:(c.sec!=null?'Kap. '+(c.sec+1):'')}`}
function citeText(c){return `„${c.quote}“ (${citeRef(c)})`}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已复制')}catch(e){toast('复制失败')}}
function citeSheet(c){
  const uses=['论据','反驳','背景','金句'];
  sheet(c.id?'引用':'加入引用库',`<div class="quote">${esc(c.quote)}</div><div class="cref">${esc(citeRef(c))}${(S.doc.biblio||{}).author?'':' · 先在“笔记 → 引用库”里填书目信息'}</div>
    <div class="chips" id="cu">${uses.map(u=>`<button class="chip ${c.use===u?'on':''}">${u}</button>`).join('')}</div>
    <div class="lbl">中文译文（做字幕、写中文稿用）</div><textarea id="cZ" style="min-height:70px">${esc(c.zh||'')}</textarea>
    <div class="lbl">备注</div><textarea id="cN" style="min-height:50px">${esc(c.note||'')}</textarea>
    <div class="row"><button class="btn pri" id="cS">保存</button><button class="btn" id="cA">AI 翻译</button><button class="btn" id="cC">复制引文</button><div style="flex:1"></div>${c.id?'<button class="btn" id="cX" style="color:var(--accent)">删除</button>':''}</div>`);
  let use=c.use;
  $('#cu').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;use=use===b.textContent?'':b.textContent;$('#cu').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===use))};
  $('#cS').onclick=async()=>{Object.assign(c,{use,zh:$('#cZ').value.trim(),note:$('#cN').value.trim()});S.doc.cites=S.doc.cites||[];if(!c.id){c.id=uid();c.at=Date.now();S.doc.cites.push(c)}await dput('docs',S.doc);closeSheet();toast('已存入引用库')};
  $('#cC').onclick=()=>copyText(citeText(c));
  $('#cA').onclick=async()=>{const out=$('#cZ'),btn=$('#cA');btn.disabled=true;out.value='…';
    try{await claude({max:900,system:'你是严谨的学术翻译。把引文忠实译成通顺的中文，用于视频字幕和中文写作。只输出译文，不加解释。',messages:[{role:'user',content:`语境（仅供理解，不要翻译）：${(c.ctx||'').slice(0,1500)}\n\n要翻译的引文：${c.quote}`}],onText:t=>{out.value=t}})}
    catch(e){out.value='';toast(e.message,4000)}btn.disabled=false};
  if($('#cX')){let armed=false;$('#cX').onclick=async e=>{if(!armed){armed=true;e.target.textContent='确认删除';return}S.doc.cites=S.doc.cites.filter(x=>x.id!==c.id);await dput('docs',S.doc);closeSheet();toast('已删除')}}}

/* ---------- 导读问题 ---------- */
$('#bQ').onclick=()=>qSheet();
function qSheet(scroll){
  const st=S.doc.study||{},qs=S.doc.questions||[];const groups=[];for(const q of qs){const g=q.group||'未分组';if(!groups.includes(g))groups.push(g)}
  const lastG=qs.length?(qs[qs.length-1].group||''):'';
  sheet('导读问题',`${st.big||st.q?`<div class="qhead">${st.big?`<b>大问题</b>　${esc(st.big)}${st.bigSide?`<br><span class="muted">我的立场：${esc(st.bigSide)}</span>`:''}${st.q?'<br>':''}`:''}${st.q?`<b>本周问题</b>　${esc(st.q)}${st.side?`<br><span class="muted">我的立场：${esc(st.side)}</span>`:''}`:''}</div>`:'<p class="muted" style="font-size:14px">还没设定研究问题，可以在顶部“研究”里填写。</p>'}
    ${groups.map(g=>`<div class="qg">${esc(g)} · ${qs.filter(q=>(q.group||'未分组')===g&&q.done).length}/${qs.filter(q=>(q.group||'未分组')===g).length}</div>`+qs.filter(q=>(q.group||'未分组')===g).map(q=>`<div class="qi ${q.done?'done':''}" data-q="${q.id}"><button class="qc">${q.done?'☑':'☐'}</button><div class="qt">${q.kind==='task'?'<span class="kind">阅读</span> ':''}${mdInline(q.text)}</div><button class="qe">✎</button></div>`).join('')).join('')}
    <div class="lbl">添加问题或阅读任务</div><textarea id="qNew" style="min-height:52px" placeholder="可以写页码，如 p.173，会变成可点的链接"></textarea>
    <div class="row"><input id="qGrp" placeholder="分组，如 第1周" value="${esc(lastG)}" style="max-width:150px"><div class="chips" id="qKind" style="margin:0"><button class="chip on" data-k="q">问题</button><button class="chip" data-k="task">阅读任务</button></div><button class="btn pri sm" id="qAdd">添加</button></div>
    ${(S.doc.guides||[]).length?`<details class="ai"><summary>AI 导读（${S.doc.guides.length}）</summary>${S.doc.guides.slice().reverse().map(g=>`<div class="guide">${mdBlock(`**p.${g.from}–${g.to}**\n`+g.text)}</div>`).join('')}</details>`:''}`);
  const sb=$('#shB');if(scroll!=null)sb.scrollTop=scroll;
  let kind='q';$('#qKind').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;kind=b.dataset.k;$('#qKind').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))};
  $('#qAdd').onclick=async()=>{const t=$('#qNew').value.trim();if(!t)return;S.doc.questions=S.doc.questions||[];S.doc.questions.push({id:uid(),text:t,group:$('#qGrp').value.trim(),kind,done:false,at:Date.now()});await dput('docs',S.doc);qSheet(sb.scrollTop)};
  sb.onclick=async e=>{
    const pl=e.target.closest('a.pl');if(pl){e.preventDefault();const top=sb.scrollTop;closeSheet();goPage(+pl.dataset.p);setBack('← 回到导读',()=>qSheet(top));return}
    const it=e.target.closest('.qi');if(!it)return;const q=S.doc.questions.find(x=>x.id===it.dataset.q);
    if(e.target.closest('.qc')){q.done=!q.done;await dput('docs',S.doc);qSheet(sb.scrollTop);return}
    if(e.target.closest('.qe')){const top=sb.scrollTop;it.innerHTML=`<div style="flex:1"><textarea id="qEd" style="min-height:60px">${esc(q.text)}</textarea><div class="row"><input id="qEg" value="${esc(q.group||'')}" style="max-width:150px"><button class="btn sm pri" id="qEs">保存</button><button class="btn sm" id="qEx" style="color:var(--accent)">删除</button></div></div>`;
      $('#qEs').onclick=async ev=>{ev.stopPropagation();q.text=$('#qEd').value.trim()||q.text;q.group=$('#qEg').value.trim();await dput('docs',S.doc);qSheet(top)};
      let armed=false;$('#qEx').onclick=async ev=>{ev.stopPropagation();if(!armed){armed=true;ev.target.textContent='确认删除';return}S.doc.questions=S.doc.questions.filter(x=>x.id!==q.id);await dput('docs',S.doc);qSheet(top)}}}}

/* ---------- 学习包 ---------- */
async function importPack(j){
  const d=S.doc;const st=d.study=d.study||{};let n=[];
  if(j.study){for(const k of ['big','bigSide','q','side','line'])if(j.study[k]&&(!st[k]||j.overwriteStudy))st[k]=j.study[k];n.push('研究问题')}
  if(j.questions){d.questions=d.questions||[];let c=0;for(const q of j.questions){if(!d.questions.some(x=>x.id===q.id)){d.questions.push({done:false,at:Date.now(),...q});c++}}n.push(c+' 个导读问题/任务')}
  if(j.glossary){d.glossary=d.glossary||[];let c=0;for(const g of j.glossary){if(!d.glossary.some(x=>x.term===g.term)){d.glossary.push({id:g.id||uid(),at:Date.now(),page:0,...g});c++}}n.push(c+' 个术语')}
  if(j.biblio){d.biblio=d.biblio||{};for(const [k,v] of Object.entries(j.biblio))if(v&&(!d.biblio[k]||j.biblioOverwrite))d.biblio[k]=v;n.push('书目信息')}
  if(j.archive){d.archives=d.archives||[];const a=j.archive;if(!d.archives.some(x=>x.id===a.id))d.archives.push(a);S.arcRefs=arcRefs(d)}
  await dput('docs',d);rerenderLoaded();toast('学习包已导入：'+n.join('、'),4000);qSheet()}

/* ---------- 面板 ---------- */
function sheet(t,html){$('#arcBack').classList.add('hide');$('#shT').textContent=t;$('#shB').innerHTML=html;$('#shB').onclick=null;$('#sheet').classList.remove('hide');$('#mask').classList.remove('hide');$('#shB').scrollTop=0}
function closeSheet(){$('#sheet').classList.add('hide');$('#mask').classList.add('hide')}
$('#shX').onclick=()=>closeSheet();$('#mask').onclick=()=>closeSheet();

/* ---------- 启动 ---------- */
(async()=>{db=await openDB();await loadPhr();renderLib();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
