name: 每日信息台

on:
  # GitHub 只认 UTC 时间。每个时段设两个触发点，覆盖冬令时和夏令时，
  # 先到的那次生成，后到的会自动跳过。
  schedule:
    - cron: "17 4 * * *"    # 早间：柏林冬令时 5:17 / 夏令时 6:17
    - cron: "17 5 * * *"    # 早间备用：冬令时 6:17
    - cron: "37 9 * * *"    # 午间：冬令时 10:37 / 夏令时 11:37
    - cron: "37 10 * * *"   # 午间备用：冬令时 11:37
  workflow_dispatch:
    inputs:
      mode:
        description: "auto 按时间判断 / full 完整版 / update 午间增量"
        default: auto
        type: choice
        options: [auto, full, update]
      force:
        description: "这个时段已经跑过也重新跑"
        default: true
        type: boolean

permissions:
  contents: write
  issues: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓取并生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ inputs.mode }}
          FORCE_RUN: ${{ inputs.force }}
        run: python main.py
      - name: 保存结果
        run: |
          git config user.name "info-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "每日更新 $(date -u +%F)"
          git push
