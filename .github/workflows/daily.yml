name: 每日信息台

on:
  schedule:
    - cron: "23 4 * * *"   # UTC 4:23，柏林冬令时 5:23 / 夏令时 6:23
  workflow_dispatch: {}     # 允许在网页上手动点"Run workflow"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓取并生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python main.py
      - name: 保存结果
        run: |
          git config user.name "info-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "每日更新 $(date -u +%F)"
          git push
