# ============================================================
# 信息台的全部订阅都在这个文件里。改这里就能增删来源。
#   section: 归到哪个板块（简讯里的分组）
#   stance:  立场卡，AI 做多方对比时会参考
#   enabled: false 表示暂时关闭
# ============================================================

settings:
  max_items_per_source: 8      # 每个来源最多取几条
  max_age_hours: 36            # 只要最近多少小时内的内容
  timezone: Europe/Berlin

# ---------- 长期跟踪的主线（推特串形式，会累积时间线） ----------
threads:
  - id: us-iran
    title: 美国政治与美伊战争
    keywords: [Iran, Hormuz, Midterm, Kongress, Congress, Trump, 伊朗, 霍尔木兹]
  - id: china-elite
    title: 中国高层政治
    keywords: [Xi, Politbüro, Politburo, Zentralkomitee, Plenum, 全会, 中纪委, PLA, 军委, purge]
  - id: berlin-linke
    title: 柏林左翼党组阁
    keywords: [Eralp, Linke Berlin, rot-grün-rot, Koalitionsverhandlungen, Vergesellschaftung]
  - id: vw-igmetall
    title: 大众与 IG Metall 劳资谈判
    keywords: [Volkswagen, VW, IG Metall, Emden, Tarif, Zwickau]

